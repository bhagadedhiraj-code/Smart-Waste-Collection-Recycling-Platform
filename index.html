            bg: "bg-purple-50 text-purple-700 border-purple-200",
            icon: <Icons.EWaste className="w-4 h-4 mr-1 text-purple-600" />
          };
        default:
          return {
            bg: "bg-slate-100 text-slate-700 border-slate-200",
            icon: <Icons.Other className="w-4 h-4 mr-1 text-slate-600" />
          };
      }
    };

    // Status badge component
    const StatusBadge = ({ status }) => {
      let config = {
        bg: "bg-slate-100 text-slate-700 border-slate-200",
        icon: null
      };

      if (status === "Pending") {
        config = {
          bg: "bg-amber-100 text-amber-800 border-amber-300",
          icon: <Icons.Clock className="w-3.5 h-3.5 mr-1 text-amber-600" />
        };
      } else if (status === "Scheduled") {
        config = {
          bg: "bg-sky-100 text-sky-800 border-sky-300",
          icon: <Icons.Calendar className="w-3.5 h-3.5 mr-1 text-sky-600" />
        };
      } else if (status === "Completed") {
        config = {
          bg: "bg-emerald-100 text-emerald-800 border-emerald-300",
          icon: <Icons.CheckCircle className="w-3.5 h-3.5 mr-1 text-emerald-600" />
        };
      } else if (status === "Cancelled") {
        config = {
          bg: "bg-rose-100 text-rose-800 border-rose-300",
          icon: <Icons.XCircle className="w-3.5 h-3.5 mr-1 text-rose-600" />
        };
      }

      return (
        <span className={`inline-flex items-center px-2.5 py-1 rounded-full text-xs font-semibold border ${config.bg}`}>
          {config.icon}
          {status}
        </span>
      );
    };

    // ==========================================
    // MAIN APP COMPONENT
    // ==========================================
    function App() {
      const [currentPage, setCurrentPage] = useState("home");
      const [selectedCategory, setSelectedCategory] = useState("Plastic");
      const [requests, setRequests] = useState([]);
      const [userProfile, setUserProfile] = useState(INITIAL_USER_PROFILE);
      const [toast, setToast] = useState(null);
      const [activeModalRequest, setActiveModalRequest] = useState(null);
      const [showInfoModal, setShowInfoModal] = useState(false);
      const [mobileMenuOpen, setMobileMenuOpen] = useState(false);
      const [otpModalState, setOtpModalState] = useState(null); // { phone, callback, currentOtp }
      const [isAdminAuthenticated, setIsAdminAuthenticated] = useState(true);

      // Load initial data from localStorage
      useEffect(() => {
        try {
          const savedRequests = localStorage.getItem("ecocollect_requests");
          if (savedRequests) {
            setRequests(JSON.parse(savedRequests));
          } else {
            localStorage.setItem("ecocollect_requests", JSON.stringify(INITIAL_SAMPLE_DATA));
            setRequests(INITIAL_SAMPLE_DATA);
          }

          const savedProfile = localStorage.getItem("ecocollect_user_profile");
          if (savedProfile) {
            setUserProfile(JSON.parse(savedProfile));
          } else {
            localStorage.setItem("ecocollect_user_profile", JSON.stringify(INITIAL_USER_PROFILE));
          }
        } catch (e) {
          console.error("Failed to load data from localStorage", e);
          setRequests(INITIAL_SAMPLE_DATA);
        }
      }, []);

      // Update requests
      const updateRequests = (newRequests) => {
        setRequests(newRequests);
        try {
          localStorage.setItem("ecocollect_requests", JSON.stringify(newRequests));
        } catch (e) {
          console.error("Failed to save requests", e);
        }
      };

      // Update profile
      const updateUserProfile = (newProfile) => {
        setUserProfile(newProfile);
        try {
          localStorage.setItem("ecocollect_user_profile", JSON.stringify(newProfile));
        } catch (e) {
          console.error("Failed to save profile", e);
        }
      };

      // Toast alert
      const showToast = (message, type = "success") => {
        setToast({ message, type });
        setTimeout(() => setToast(null), 4000);
      };

      // Reset to dummy data
      const handleResetSampleData = () => {
        updateRequests(INITIAL_SAMPLE_DATA);
        updateUserProfile(INITIAL_USER_PROFILE);
        showToast("Restored demo sample data and user profile successfully!");
      };

      // Start Phone OTP Authentication
      const triggerOtpVerification = (phone, onSuccess) => {
        const generatedCode = Math.floor(1000 + Math.random() * 9000).toString();
        setOtpModalState({
          phone: phone,
          expectedOtp: generatedCode,
          callback: onSuccess
        });
      };

      // Handle successful OTP verification
      const handleOtpSuccess = (verifiedPhone) => {
        // Update user profile phone verification
        const updated = {
          ...userProfile,
          phone: verifiedPhone,
          isPhoneVerified: true
        };
        updateUserProfile(updated);
        showToast(`Mobile number +91 ${verifiedPhone} verified successfully!`);
        if (otpModalState && otpModalState.callback) {
          otpModalState.callback(verifiedPhone);
        }
        setOtpModalState(null);
      };

      // Add new request
      const handleCreateRequest = (newRequest) => {
        const updated = [newRequest, ...requests];
        updateRequests(updated);

        // Update profile eco stats
        const updatedProfile = {
          ...userProfile,
          ecoPoints: userProfile.ecoPoints + 50,
          totalRecycledKg: +(userProfile.totalRecycledKg + 4.5).toFixed(1)
        };
        updateUserProfile(updatedProfile);

        showToast(`Request ${newRequest.id} submitted! +50 Eco-Points earned!`);
        setCurrentPage("my-requests");
      };

      // Update status
      const handleStatusChange = (requestId, newStatus) => {
        const updated = requests.map(req => 
          req.id === requestId ? { ...req, status: newStatus } : req
        );
        updateRequests(updated);
        showToast(`Request ${requestId} status updated to ${newStatus}`);
        if (activeModalRequest && activeModalRequest.id === requestId) {
          setActiveModalRequest({ ...activeModalRequest, status: newStatus });
        }
      };

      // Cancel a request
      const handleCancelRequest = (requestId) => {
        const target = requests.find(r => r.id === requestId);
        if (!target) return;
        if (target.status === "Cancelled") {
          showToast(`Request ${requestId} is already cancelled.`, "info");
          return;
        }
        const updated = requests.map(req => 
          req.id === requestId ? { ...req, status: "Cancelled" } : req
        );
        updateRequests(updated);
        showToast(`Pickup request ${requestId} has been cancelled.`);
        if (activeModalRequest && activeModalRequest.id === requestId) {
          setActiveModalRequest({ ...activeModalRequest, status: "Cancelled" });
        }
      };

      // Delete request permanently
      const handleDeleteRequest = (requestId) => {
        if (!window.confirm(`Are you sure you want to permanently delete request ${requestId}?`)) {
          return;
        }
        const updated = requests.filter(req => req.id !== requestId);
        updateRequests(updated);
        showToast(`Request ${requestId} deleted successfully.`);
        if (activeModalRequest && activeModalRequest.id === requestId) {
          setActiveModalRequest(null);
        }
      };

      // Re-order / clone a previous request
      const handleReorder = (oldRequest) => {
        setSelectedCategory(oldRequest.category || "Plastic");
        setCurrentPage("request");
        showToast(`Prefilled form with details from ${oldRequest.id}!`);
      };

      // Export all requests as CSV
      const handleExportCSV = () => {
        if (requests.length === 0) {
          showToast("No requests available to export.", "info");
          return;
        }
        const headers = ["Request ID", "Name", "Phone", "Category", "Pickup Date", "Address", "City", "Pincode", "Status", "Notes", "Created At"];
        const rows = requests.map(r => [
          r.id,
          `"${(r.name || "").replace(/"/g, '""')}"`,
          `"${(r.phone || "").replace(/"/g, '""')}"`,
          `"${(r.category || "").replace(/"/g, '""')}"`,
          r.date,
          `"${(r.address || "").replace(/"/g, '""')}"`,
          `"${(r.city || "").replace(/"/g, '""')}"`,
          `"${(r.pincode || "").replace(/"/g, '""')}"`,
          r.status,
          `"${(r.notes || "").replace(/"/g, '""')}"`,
          r.createdAt
        ]);
        const csvContent = "data:text/csv;charset=utf-8," + [headers.join(","), ...rows.map(e => e.join(","))].join("\n");
        const encodedUri = encodeURI(csvContent);
        const link = document.createElement("a");
        link.setAttribute("href", encodedUri);
        link.setAttribute("download", `ecocollect_pickups_${new Date().toISOString().slice(0,10)}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        showToast("CSV report downloaded successfully!");
      };

      // Clear completed/cancelled items
      const handleClearCompleted = () => {
        const remaining = requests.filter(r => r.status !== "Completed" && r.status !== "Cancelled");
        if (remaining.length === requests.length) {
          showToast("No completed or cancelled requests to clean up.", "info");
          return;
        }
        if (!window.confirm("Clean up all Completed and Cancelled records from the list?")) return;
        updateRequests(remaining);
        showToast("Cleaned up archived requests successfully.");
      };

      // Navigation with category selector from homepage
      const handleSelectCategoryAndNavigate = (categoryName) => {
        setSelectedCategory(categoryName);
        setCurrentPage("request");
        showToast(`Category "${categoryName}" selected for pickup!`);
      };

      // Calculate stats for Admin
      const totalRequests = requests.length;
      const pendingCount = requests.filter(r => r.status === "Pending").length;
      const scheduledCount = requests.filter(r => r.status === "Scheduled").length;
      const completedCount = requests.filter(r => r.status === "Completed").length;

      return (
        <div className="flex flex-col min-h-screen">
          {/* Top Navigation Bar */}
          <header className="bg-white border-b border-slate-200 sticky top-0 z-40 shadow-sm no-print">
            <div className="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8">
              <div className="flex items-center justify-between h-16">
                
                {/* Logo Button */}
                <button 
                  type="button"
                  className="flex items-center space-x-3 group text-left focus:outline-none"
                  onClick={() => { setCurrentPage("home"); setMobileMenuOpen(false); }}
                  title="Go to EcoCollect Home"
                >
                  <div className="w-10 h-10 rounded-xl bg-emerald-600 text-white flex items-center justify-center shadow-md shadow-emerald-200 group-hover:bg-emerald-700 transition transform group-hover:scale-105">
                    <Icons.Recycle className="w-6 h-6" />
                  </div>
                  <div>
                    <span className="text-xl font-extrabold tracking-tight text-slate-900 group-hover:text-emerald-700 transition">
                      Eco<span className="text-emerald-600">Collect</span>
                    </span>
                    <span className="hidden sm:block text-xs text-slate-500 font-medium">Doorstep Recycling Portal</span>
                  </div>
                </button>

                {/* Desktop Navigation Links */}
                <nav className="hidden md:flex items-center space-x-1.5">
                  <button
                    type="button"
                    onClick={() => setCurrentPage("home")}
                    className={`px-3.5 py-2 rounded-xl text-sm font-semibold transition ${
                      currentPage === "home"
                        ? "bg-emerald-50 text-emerald-700 shadow-sm"
                        : "text-slate-600 hover:text-slate-900 hover:bg-slate-100"
                    }`}
                  >
                    Home
                  </button>

                  <button
                    type="button"
                    onClick={() => setCurrentPage("request")}
                    className={`px-3.5 py-2 rounded-xl text-sm font-semibold transition flex items-center ${
                      currentPage === "request"
                        ? "bg-emerald-50 text-emerald-700 shadow-sm"
                        : "text-slate-600 hover:text-slate-900 hover:bg-slate-100"
                    }`}
                  >
                    <Icons.Plus className="w-4 h-4 mr-1 text-emerald-600" />
                    Request Pickup
                  </button>

                  <button
                    type="button"
                    onClick={() => setCurrentPage("my-requests")}
                    className={`px-3.5 py-2 rounded-xl text-sm font-semibold transition flex items-center relative ${
                      currentPage === "my-requests"
                        ? "bg-emerald-50 text-emerald-700 shadow-sm"
                        : "text-slate-600 hover:text-slate-900 hover:bg-slate-100"
                    }`}
                  >
                    My Requests
                    {requests.length > 0 && (
                      <span className="ml-1.5 px-2 py-0.5 text-xs rounded-full bg-emerald-100 text-emerald-800 font-bold">
                        {requests.length}
                      </span>
                    )}
                  </button>

                  {/* Profile Page Navigation Button */}
                  <button
                    type="button"
                    onClick={() => setCurrentPage("profile")}
                    className={`px-3.5 py-2 rounded-xl text-sm font-semibold transition flex items-center ${
                      currentPage === "profile"
                        ? "bg-emerald-50 text-emerald-700 shadow-sm"
                        : "text-slate-600 hover:text-slate-900 hover:bg-slate-100"
                    }`}
                  >
                    <div className="w-5 h-5 rounded-full bg-emerald-100 text-emerald-800 font-extrabold text-[10px] flex items-center justify-center mr-1.5 border border-emerald-300">
                      {userProfile.name.charAt(0)}
                    </div>
                    <span>Profile</span>
                    {userProfile.isPhoneVerified && (
                      <span className="ml-1 text-emerald-600 font-extrabold text-xs" title="Verified Mobile Number">✓</span>
                    )}
                  </button>

                  <div className="h-5 w-px bg-slate-200 mx-1"></div>

                  {/* Admin Portal Button */}
                  <button
                    type="button"
                    onClick={() => setCurrentPage("admin")}
                    className={`px-4 py-2 rounded-xl text-sm font-semibold transition flex items-center ${
                      currentPage === "admin"
                        ? "bg-slate-900 text-white shadow-md shadow-slate-900/20"
                        : "text-slate-700 hover:bg-slate-100 border border-slate-200"
                    }`}
                  >
                    <Icons.Shield className="w-4 h-4 mr-1.5 text-emerald-400" />
                    Admin Portal
                  </button>
                </nav>

                {/* Mobile Hamburger Button */}
                <div className="md:hidden flex items-center space-x-2">
                  <button
                    type="button"
                    onClick={() => setMobileMenuOpen(!mobileMenuOpen)}
                    className="p-2 rounded-xl text-slate-600 hover:text-slate-900 hover:bg-slate-100 focus:outline-none"
                    aria-label="Toggle Navigation Menu"
                  >
                    {mobileMenuOpen ? <Icons.X className="w-6 h-6" /> : <Icons.Menu className="w-6 h-6" />}
                  </button>
                </div>
              </div>
            </div>

            {/* Mobile Dropdown Menu */}
            {mobileMenuOpen && (
              <div className="md:hidden border-t border-slate-200 bg-white px-4 pt-2 pb-4 space-y-1 shadow-lg">
                <button
                  type="button"
                  onClick={() => { setCurrentPage("home"); setMobileMenuOpen(false); }}
                  className={`w-full text-left px-3 py-2.5 rounded-xl text-sm font-semibold ${
                    currentPage === "home" ? "bg-emerald-50 text-emerald-700" : "text-slate-700 hover:bg-slate-50"
                  }`}
                >
                  Home
                </button>
                <button
                  type="button"
                  onClick={() => { setCurrentPage("request"); setMobileMenuOpen(false); }}
                  className={`w-full text-left px-3 py-2.5 rounded-xl text-sm font-semibold flex items-center ${
                    currentPage === "request" ? "bg-emerald-50 text-emerald-700" : "text-slate-700 hover:bg-slate-50"
                  }`}
                >
                  <Icons.Plus className="w-4 h-4 mr-2 text-emerald-600" />
                  Request Pickup
                </button>
                <button
                  type="button"
                  onClick={() => { setCurrentPage("my-requests"); setMobileMenuOpen(false); }}
                  className={`w-full text-left px-3 py-2.5 rounded-xl text-sm font-semibold flex items-center justify-between ${
                    currentPage === "my-requests" ? "bg-emerald-50 text-emerald-700" : "text-slate-700 hover:bg-slate-50"
                  }`}
                >
                  <span>My Requests</span>
                  <span className="px-2 py-0.5 text-xs rounded-full bg-emerald-100 text-emerald-800 font-bold">
                    {requests.length}
                  </span>
                </button>
                <button
                  type="button"
                  onClick={() => { setCurrentPage("profile"); setMobileMenuOpen(false); }}
                  className={`w-full text-left px-3 py-2.5 rounded-xl text-sm font-semibold flex items-center ${
                    currentPage === "profile" ? "bg-emerald-50 text-emerald-700" : "text-slate-700 hover:bg-slate-50"
                  }`}
                >
                  <Icons.User className="w-4 h-4 mr-2 text-emerald-600" />
                  User Profile ({userProfile.name})
                </button>
                <button
                  type="button"
                  onClick={() => { setCurrentPage("admin"); setMobileMenuOpen(false); }}
                  className={`w-full text-left px-3 py-2.5 rounded-xl text-sm font-semibold flex items-center ${
                    currentPage === "admin" ? "bg-slate-900 text-white" : "text-slate-700 hover:bg-slate-50"
                  }`}
                >
                  <Icons.Shield className="w-4 h-4 mr-2 text-emerald-400" />
                  Admin Dashboard
                </button>
              </div>
            )}
          </header>

          {/* Toast Notification with Dismiss button */}
          {toast && (
            <div className="fixed bottom-5 right-5 z-50 animate-bounce no-print">
              <div className="bg-slate-900 text-white px-4 py-3 rounded-2xl shadow-2xl flex items-center space-x-3 border border-slate-700">
                <span className="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse"></span>
                <span className="text-sm font-medium">{toast.message}</span>
                <button
                  type="button"
                  onClick={() => setToast(null)}
                  className="text-slate-400 hover:text-white p-1 rounded-lg focus:outline-none"
                  title="Dismiss notification"
                >
                  <Icons.X className="w-3.5 h-3.5" />
                </button>
              </div>
            </div>
          )}

          {/* Main Content Area */}
          <main className="flex-1 max-w-6xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
            {currentPage === "home" && (
              <HomePage 
                userProfile={userProfile}
                onNavigateRequest={() => setCurrentPage("request")}
                onNavigateMyRequests={() => setCurrentPage("my-requests")}
                onNavigateProfile={() => setCurrentPage("profile")}
                onSelectCategory={handleSelectCategoryAndNavigate}
                onOpenInfo={() => setShowInfoModal(true)}
              />
            )}

            {currentPage === "request" && (
              <RequestPickupPage 
                initialCategory={selectedCategory}
                userProfile={userProfile}
                onTriggerOtp={triggerOtpVerification}
                onSubmit={handleCreateRequest}
                onCancel={() => setCurrentPage("home")}
                onNavigateProfile={() => setCurrentPage("profile")}
              />
            )}

            {currentPage === "my-requests" && (
              <MyRequestsPage 
                requests={requests}
                onNewRequest={() => setCurrentPage("request")}
                onViewDetails={(req) => setActiveModalRequest(req)}
                onCancelRequest={handleCancelRequest}
                onDeleteRequest={handleDeleteRequest}
                onReorder={handleReorder}
              />
            )}

            {currentPage === "profile" && (
              <ProfilePage 
                userProfile={userProfile}
                onUpdateProfile={updateUserProfile}
                onTriggerOtp={triggerOtpVerification}
                onSchedulePickup={() => setCurrentPage("request")}
                onViewRequests={() => setCurrentPage("my-requests")}
                onToast={showToast}
              />
            )}

            {currentPage === "admin" && (
              <AdminDashboardPage 
                requests={requests}
                totalRequests={totalRequests}
                pendingCount={pendingCount}
                scheduledCount={scheduledCount}
                completedCount={completedCount}
                onStatusChange={handleStatusChange}
                onCancelRequest={handleCancelRequest}
                onDeleteRequest={handleDeleteRequest}
                onResetSampleData={handleResetSampleData}
                onExportCSV={handleExportCSV}
                onClearCompleted={handleClearCompleted}
                onViewDetails={(req) => setActiveModalRequest(req)}
                onOpenNewPickup={() => setCurrentPage("request")}
              />
            )}
          </main>

          {/* Phone OTP Verification Modal */}
          {otpModalState && (
            <OtpVerificationModal 
              phone={otpModalState.phone}
              expectedOtp={otpModalState.expectedOtp}
              onVerify={handleOtpSuccess}
              onResend={() => {
                const newCode = Math.floor(1000 + Math.random() * 9000).toString();
                setOtpModalState(prev => ({ ...prev, expectedOtp: newCode }));
                showToast(`New OTP sent to +91 ${otpModalState.phone}`);
              }}
              onClose={() => setOtpModalState(null)}
            />
          )}

          {/* Request Detail & Tracking Modal */}
          {activeModalRequest && (
            <DetailModal 
              request={activeModalRequest}
              isAdmin={currentPage === "admin"}
              onClose={() => setActiveModalRequest(null)}
              onCancelRequest={handleCancelRequest}
              onStatusChange={handleStatusChange}
              onDeleteRequest={handleDeleteRequest}
            />
          )}

          {/* Help & About Modal */}
          {showInfoModal && (
            <InfoModal onClose={() => setShowInfoModal(false)} />
          )}

          {/* Clean Footer */}
          <footer className="bg-white border-t border-slate-200 py-6 text-center text-xs text-slate-500 no-print mt-auto">
            <div className="max-w-6xl mx-auto px-4 flex flex-col sm:flex-row items-center justify-between gap-4">
              <div className="flex items-center space-x-2">
                <Icons.Leaf className="w-4 h-4 text-emerald-600" />
                <span className="font-bold text-slate-800">EcoCollect</span>
                <span>— Smart Waste Collection Portal</span>
              </div>
              <div className="flex flex-wrap items-center justify-center gap-4">
                <button 
                  type="button"
                  onClick={handleResetSampleData}
                  className="text-emerald-700 hover:text-emerald-800 font-semibold underline flex items-center"
                  title="Reload default sample dataset"
                >
                  <Icons.Recycle className="w-3.5 h-3.5 mr-1" />
                  Reload Sample Data
                </button>
                <span>•</span>
                <button
                  type="button"
                  onClick={() => setShowInfoModal(true)}
                  className="text-slate-600 hover:text-slate-900 font-semibold hover:underline flex items-center"
                >
                  <Icons.Help className="w-3.5 h-3.5 mr-1 text-slate-500" />
                  Help & FAQs
                </button>
                <span>•</span>
                <button
                  type="button"
                  onClick={() => window.scrollTo({ top: 0, behavior: 'smooth' })}
                  className="text-slate-600 hover:text-slate-900 font-semibold hover:underline flex items-center"
                >
                  <Icons.ArrowUp className="w-3.5 h-3.5 mr-1 text-slate-500" />
                  Back to Top
                </button>
              </div>
            </div>
          </footer>
        </div>
      );
    }

    // ==========================================
    // PAGE 1: HOME PAGE
    // ==========================================
    function HomePage({ userProfile, onNavigateRequest, onNavigateMyRequests, onNavigateProfile, onSelectCategory, onOpenInfo }) {
      const categories = [
        { title: "Plastic", desc: "Bottles, jugs & containers", icon: <Icons.Plastic className="w-7 h-7 text-blue-600" /> },
        { title: "Paper", desc: "Cardboard & paper bags", icon: <Icons.Paper className="w-7 h-7 text-amber-600" /> },
        { title: "Organic", desc: "Food scraps & garden waste", icon: <Icons.Leaf className="w-7 h-7 text-emerald-600" /> },
        { title: "E-Waste", desc: "Batteries, cords & gadgets", icon: <Icons.EWaste className="w-7 h-7 text-purple-600" /> },
        { title: "Other", desc: "Mixed recyclable goods", icon: <Icons.Other className="w-7 h-7 text-slate-600" /> },
      ];

      return (
        <div className="space-y-12">
          {/* User Welcome Banner if Authenticated */}
          <div className="bg-emerald-50 border border-emerald-200 rounded-2xl p-4 flex flex-col sm:flex-row sm:items-center justify-between gap-3 shadow-sm">
            <div className="flex items-center space-x-3">
              <div className="w-10 h-10 rounded-xl bg-emerald-600 text-white font-extrabold text-sm flex items-center justify-center shadow-sm">
                {userProfile.name.charAt(0)}
              </div>
              <div>
                <div className="flex items-center space-x-2">
                  <span className="font-bold text-slate-900 text-sm">Welcome back, {userProfile.name}!</span>
                  <span className="inline-flex items-center px-2 py-0.5 rounded-full text-[11px] font-bold bg-emerald-100 text-emerald-800 border border-emerald-300">
                    <Icons.ShieldCheck className="w-3.5 h-3.5 mr-1 text-emerald-600" />
                    Mobile Verified
                  </span>

    // ==========================================
    // PAGE 2: REQUEST PICKUP FORM WITH VALIDATIONS
    // ==========================================
    function RequestPickupPage({ initialCategory, userProfile, onTriggerOtp, onSubmit, onCancel, onNavigateProfile }) {
      const [formData, setFormData] = useState({
        name: userProfile.name || "",
        phone: userProfile.phone || "",
        isPhoneVerified: userProfile.isPhoneVerified || false,
        category: initialCategory || "Plastic",
        flat: userProfile.savedAddresses[0]?.flat || "",
        street: userProfile.savedAddresses[0]?.street || "",
        landmark: userProfile.savedAddresses[0]?.landmark || "",
        city: userProfile.savedAddresses[0]?.city || "",
        state: userProfile.savedAddresses[0]?.state || "California",
        pincode: userProfile.savedAddresses[0]?.pincode || "",
        notes: "",
        date: new Date().toISOString().split("T")[0]
      });

      const [errors, setErrors] = useState({});
      const [isDetectingGps, setIsDetectingGps] = useState(false);
      const [saveToProfile, setSaveToProfile] = useState(false);

      useEffect(() => {
        if (initialCategory) {
          setFormData(prev => ({ ...prev, category: initialCategory }));
        }
      }, [initialCategory]);

      // Comprehensive Validations for Form and Address
      const validate = () => {
        const errs = {};
        
        // Name validation
        if (!formData.name.trim()) {
          errs.name = "Full name is required";
        } else if (formData.name.trim().length < 2) {
          errs.name = "Name must be at least 2 characters";
        } else if (!/^[a-zA-Z\s.'-]+$/.test(formData.name.trim())) {
          errs.name = "Name can only contain letters, spaces and periods";
        }

        // Phone validation (10 digits)
        const cleanPhone = formData.phone.replace(/\D/g, "");
        if (!formData.phone.trim()) {
          errs.phone = "Mobile phone number is required";
        } else if (cleanPhone.length !== 10) {
          errs.phone = "Mobile number must be exactly 10 digits (e.g. 9876543210)";
        } else if (!formData.isPhoneVerified) {
          errs.phone = "Mobile number must be OTP verified before booking";
        }

        // Category
        if (!formData.category) {
          errs.category = "Please select a waste category";
        }

        // Structured Address Validations
        if (!formData.flat.trim()) {
          errs.flat = "House / Flat / Door number is required";
        } else if (formData.flat.trim().length < 2) {
          errs.flat = "Enter a valid flat or building address";
        }

        if (!formData.street.trim()) {
          errs.street = "Street / Area / Road name is required";
        } else if (formData.street.trim().length < 4) {
          errs.street = "Street name is too short (min 4 characters)";
        }

        if (!formData.city.trim()) {
          errs.city = "City name is required";
        } else if (!/^[a-zA-Z\s-]+$/.test(formData.city.trim())) {
          errs.city = "City name should only contain letters";
        }

        if (!formData.pincode.trim()) {
          errs.pincode = "Postal PIN code is required";
        } else if (!/^\d{5,6}$/.test(formData.pincode.trim())) {
          errs.pincode = "Enter a valid 5 or 6 digit PIN / Postal code";
        }

        // Date validation
        const todayStr = new Date().toISOString().split("T")[0];
        if (!formData.date) {
          errs.date = "Pickup date is required";
        } else if (formData.date < todayStr) {
          errs.date = "Pickup date cannot be in the past";
        }

        setErrors(errs);
        return Object.keys(errs).length === 0;
      };

      // Handle Phone change
      const handlePhoneChange = (val) => {
        const cleaned = val.replace(/\D/g, "").slice(0, 10);
        const isSameAsProfile = cleaned === userProfile.phone && userProfile.isPhoneVerified;
        setFormData({
          ...formData,
          phone: cleaned,
          isPhoneVerified: isSameAsProfile
        });
        if (errors.phone) {
          setErrors({ ...errors, phone: null });
        }
      };

      // Trigger OTP verification for current phone
      const handleVerifyPhoneClick = () => {
        const cleaned = formData.phone.replace(/\D/g, "");
        if (cleaned.length !== 10) {
          setErrors(prev => ({ ...prev, phone: "Please enter a valid 10-digit mobile number first" }));
          return;
        }
        onTriggerOtp(cleaned, (verifiedNumber) => {
          setFormData(prev => ({ ...prev, phone: verifiedNumber, isPhoneVerified: true }));
          setErrors(prev => ({ ...prev, phone: null }));
        });
      };

      // Apply saved address from Profile
      const handleSelectSavedAddress = (addr) => {
        setFormData(prev => ({
          ...prev,
          flat: addr.flat,
          street: addr.street,
          landmark: addr.landmark || "",
          city: addr.city,
          state: addr.state,
          pincode: addr.pincode
        }));
        setErrors(prev => ({ ...prev, flat: null, street: null, city: null, pincode: null }));
      };

      // GPS Location Detection
      const handleDetectGps = () => {
        setIsDetectingGps(true);
        if ("geolocation" in navigator) {
          navigator.geolocation.getCurrentPosition(
            (pos) => {
              setIsDetectingGps(false);
              // Auto-fill realistic authenticated coordinates and verified address
              setFormData(prev => ({
                ...prev,
                flat: prev.flat || "GPS Geo-Location Point",
                street: "742 Evergreen Terrace (GPS Verified)",
                landmark: `Near Lat ${pos.coords.latitude.toFixed(3)}, Lng ${pos.coords.longitude.toFixed(3)}`,
                city: prev.city || "Springfield",
                state: prev.state || "California",
                pincode: prev.pincode || "97477"
              }));
              setErrors(prev => ({ ...prev, flat: null, street: null, city: null, pincode: null }));
            },
            (err) => {
              setIsDetectingGps(false);
              // Fallback default authenticated mock
              setFormData(prev => ({
                ...prev,
                flat: "Flat 101, Green Horizon",
                street: "42 Eco Boulevard (GPS Point)",
                landmark: "Near Eco Park",
                city: "Springfield",
                state: "California",
                pincode: "97477"
              }));
            },
            { timeout: 5000 }
          );
        } else {
          setIsDetectingGps(false);
          setFormData(prev => ({
            ...prev,
            flat: "House 24, Sun Crest",
            street: "12 Valley Road",
            city: "Springfield",
            state: "California",
            pincode: "97477"
          }));
        }
      };

      // Form submission
      const handleSubmit = (e) => {
        e.preventDefault();
        
        // If phone not verified, prompt verification automatically
        const cleanPhone = formData.phone.replace(/\D/g, "");
        if (cleanPhone.length === 10 && !formData.isPhoneVerified) {
          handleVerifyPhoneClick();
          return;
        }

        if (!validate()) return;

        const fullFormattedAddress = `${formData.flat}, ${formData.street}${formData.landmark ? `, ${formData.landmark}` : ""}, ${formData.city}, ${formData.state} - ${formData.pincode}`;

        const randomNum = Math.floor(1000 + Math.random() * 9000);
        const newRequest = {
          id: `EC-${randomNum}`,
          name: formData.name.trim(),
          phone: cleanPhone,
          isPhoneVerified: true,
          category: formData.category,
          address: fullFormattedAddress,
          flat: formData.flat.trim(),
          street: formData.street.trim(),
          landmark: formData.landmark.trim(),
          city: formData.city.trim(),
          state: formData.state,
          pincode: formData.pincode.trim(),
          notes: formData.notes.trim() || "No extra notes provided.",
          date: formData.date,
          status: "Pending",
          createdAt: new Date().toISOString()
        };

        onSubmit(newRequest);
      };

      // Auto-fill demo data
      const handleAutoFill = () => {
        const tomorrow = new Date();
        tomorrow.setDate(tomorrow.getDate() + 1);
        const dateStr = tomorrow.toISOString().split("T")[0];

        setFormData({
          name: "Jane Cooper",
          phone: "9876543210",
          isPhoneVerified: true,
          category: "Plastic",
          flat: "Flat 402, Green Meadows",
          street: "742 Evergreen Terrace",
          landmark: "Near Central Park",
          city: "Springfield",
          state: "California",
          pincode: "97477",
          notes: "2 clear bags of sorted plastic bottles & jugs",
          date: dateStr
        });
        setErrors({});
      };

      const categoryOptions = ["Plastic", "Paper", "Organic", "E-Waste", "Other"];
      const states = ["California", "New York", "Texas", "Illinois", "Florida", "Washington", "Massachusetts", "Georgia", "Other"];

      return (
        <div className="max-w-2xl mx-auto">
          <div className="bg-white rounded-3xl border border-slate-200 shadow-xl p-6 sm:p-10">
            {/* Header */}
            <div className="mb-6 pb-4 border-b border-slate-100 flex items-start justify-between">
              <div>
                <div className="flex items-center space-x-2 text-emerald-600 font-semibold text-xs tracking-wider uppercase mb-1">
                  <Icons.Plus className="w-4 h-4" />
                  <span>Authenticated Pickup Scheduler</span>
                </div>
                <h2 className="text-2xl sm:text-3xl font-extrabold text-slate-900">Request Waste Pickup</h2>
                <p className="text-xs text-slate-500 mt-1">Verified mobile authentication and validated doorstep address</p>
              </div>

              {/* Auto-Fill Demo Button */}
              <button
                type="button"
                onClick={handleAutoFill}
                className="inline-flex items-center text-xs font-bold text-emerald-700 bg-emerald-50 hover:bg-emerald-100 border border-emerald-200 px-3.5 py-1.5 rounded-xl shadow-sm transition active:scale-95"
                title="Fill verified demo data with 1 click"
              >
                <Icons.Sparkles className="w-3.5 h-3.5 mr-1.5 text-emerald-600" />
                Auto-Fill Demo
              </button>
            </div>

            <form onSubmit={handleSubmit} className="space-y-6">
              {/* Requester Contact & Mobile Authentication */}
              <div className="bg-slate-50 p-5 rounded-2xl border border-slate-200 space-y-4">
                <div className="flex items-center justify-between">
                  <h3 className="text-xs font-extrabold text-slate-800 uppercase tracking-wider flex items-center">
                    <Icons.ShieldCheck className="w-4 h-4 mr-1.5 text-emerald-600" />
                    Requester &amp; Mobile Authentication
                  </h3>
                  {formData.isPhoneVerified ? (
                    <span className="inline-flex items-center px-2 py-0.5 rounded-full text-[11px] font-bold bg-emerald-100 text-emerald-800 border border-emerald-300">
                      ✓ Mobile Authenticated
                    </span>
                  ) : (
                    <span className="inline-flex items-center px-2 py-0.5 rounded-full text-[11px] font-bold bg-amber-100 text-amber-800 border border-amber-300">
                      OTP Verification Required
                    </span>
                  )}
                </div>

                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                  {/* Name */}
                  <div>
                    <label className="block text-xs font-bold text-slate-700 mb-1">
                      Full Name *
                    </label>
                    <div className="relative">
                      <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                        <Icons.User className="w-4 h-4" />
                      </div>
                      <input
                        type="text"
                        value={formData.name}
                        onChange={(e) => setFormData({ ...formData, name: e.target.value })}
                        placeholder="e.g. Jane Cooper"
                        className={`w-full pl-9 pr-3 py-2 bg-white border rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-emerald-500 transition ${
                          errors.name ? "border-rose-400 bg-rose-50/20" : "border-slate-200"
                        }`}
                      />
                    </div>
                    {errors.name && <p className="text-rose-500 text-[11px] mt-1">{errors.name}</p>}
                  </div>

                  {/* Mobile Number with OTP Verification Button */}
                  <div>
                    <label className="block text-xs font-bold text-slate-700 mb-1">
                      10-Digit Mobile Number *
                    </label>
                    <div className="flex space-x-2">
                      <div className="relative flex-1">
                        <div className="absolute inset-y-0 left-0 pl-2.5 flex items-center pointer-events-none text-slate-400 text-xs font-bold">
                          +91
                        </div>
                        <input
                          type="tel"
                          value={formData.phone}
                          onChange={(e) => handlePhoneChange(e.target.value)}
                          placeholder="9876543210"
                          maxLength="10"
                          className={`w-full pl-10 pr-3 py-2 bg-white border rounded-xl text-xs font-mono font-bold focus:outline-none focus:ring-2 focus:ring-emerald-500 transition ${
                            errors.phone ? "border-rose-400 bg-rose-50/20" : "border-slate-200"
                          }`}
                        />
                      </div>

                      {/* OTP Action Button */}
                      {!formData.isPhoneVerified ? (
                        <button
                          type="button"
                          onClick={handleVerifyPhoneClick}
                          className="px-3 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-xs font-bold shadow-sm transition active:scale-95 whitespace-nowrap"
                        >
                          Verify OTP
                        </button>
                      ) : (
                        <button
                          type="button"
                          onClick={handleVerifyPhoneClick}
                          className="px-2.5 py-2 bg-emerald-100 text-emerald-800 border border-emerald-300 rounded-xl text-xs font-bold flex items-center whitespace-nowrap"
                          title="Mobile is authenticated. Click to re-verify if needed."
                        >
                          ✓ Verified
                        </button>
                      )}
                    </div>
                    {errors.phone && <p className="text-rose-500 text-[11px] mt-1">{errors.phone}</p>}
                  </div>
                </div>
              </div>

              {/* Waste Category Selection */}
              <div>
                <label className="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">
                  Waste Category *
                </label>
                {/* 1-Click Category Pills */}
                <div className="grid grid-cols-3 sm:grid-cols-5 gap-2 mb-2">
                  {categoryOptions.map((cat) => (
                    <button
                      key={cat}
                      type="button"
                      onClick={() => setFormData({ ...formData, category: cat })}
                      className={`py-2 px-2 rounded-xl text-xs font-bold transition border ${
                        formData.category === cat
                          ? "bg-emerald-600 text-white border-emerald-600 shadow-sm"
                          : "bg-slate-50 text-slate-600 border-slate-200 hover:bg-slate-100"
                      }`}
                    >
                      {cat}
                    </button>
                  ))}
                </div>
              </div>

              {/* Structured Address Authentication & Validation */}
              <div className="bg-slate-50 p-5 rounded-2xl border border-slate-200 space-y-4">
                <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2 pb-2 border-b border-slate-200/60">
                  <div>
                    <h3 className="text-xs font-extrabold text-slate-800 uppercase tracking-wider flex items-center">
                      <Icons.MapPin className="w-4 h-4 mr-1.5 text-emerald-600" />

                    </h3>
                    <p className="text-[11px] text-slate-500">Provide verified location for the collection crew</p>
                  </div>

                  <div className="flex items-center space-x-2">
                    {/* GPS Detect Button */}
                    <button
                      type="button"
                      onClick={handleDetectGps}
                      disabled={isDetectingGps}
                      className="inline-flex items-center px-3 py-1.5 rounded-xl bg-white border border-slate-300 text-slate-700 hover:bg-emerald-50 hover:text-emerald-800 hover:border-emerald-300 text-xs font-bold transition shadow-sm"
                      title="Use device GPS to locate address"
                    >
                      <Icons.Navigation className={`w-3.5 h-3.5 mr-1 text-emerald-600 ${isDetectingGps ? 'animate-spin' : ''}`} />
                      {isDetectingGps ? "Detecting..." : "Detect GPS"}
                    </button>

                    {/* Saved Addresses Shortcut Button */}
                    {userProfile.savedAddresses.length > 0 && (
                      <div className="relative group">
                        <button
                          type="button"
                          className="px-3 py-1.5 rounded-xl bg-emerald-100 text-emerald-800 text-xs font-bold hover:bg-emerald-200 transition"
                        >
                          Saved Addresses ▾
                        </button>

    // ==========================================
    // PAGE 4: USER PROFILE & ADDRESS MANAGEMENT
    // ==========================================
    function ProfilePage({ userProfile, onUpdateProfile, onTriggerOtp, onSchedulePickup, onViewRequests, onToast }) {
      const [isEditingInfo, setIsEditingInfo] = useState(false);
      const [profileForm, setProfileForm] = useState({
        name: userProfile.name,
        email: userProfile.email,
        phone: userProfile.phone
      });
      const [showAddAddressModal, setShowAddAddressModal] = useState(false);
      const [editingAddress, setEditingAddress] = useState(null);

      // Handle profile info update
      const handleSaveProfileInfo = (e) => {
        e.preventDefault();
        if (!profileForm.name.trim()) {
          onToast("Name cannot be empty", "error");
          return;
        }
        const updated = {
          ...userProfile,
          name: profileForm.name.trim(),
          email: profileForm.email.trim()
        };
        onUpdateProfile(updated);
        setIsEditingInfo(false);
        onToast("Profile updated successfully!");
      };

      // Set address as default
      const handleSetDefaultAddress = (addrId) => {
        const updatedAddrs = userProfile.savedAddresses.map(a => ({
          ...a,
          isDefault: a.id === addrId
        }));
        onUpdateProfile({ ...userProfile, savedAddresses: updatedAddrs });
        onToast("Default pickup address updated!");
      };

      // Delete an address
      const handleDeleteAddress = (addrId) => {
        if (userProfile.savedAddresses.length <= 1) {
          onToast("You must keep at least one saved address.", "info");
          return;
        }
        const updated = userProfile.savedAddresses.filter(a => a.id !== addrId);
        onUpdateProfile({ ...userProfile, savedAddresses: updated });
        onToast("Address deleted.");
      };

      // Add or Edit Address
      const handleSaveAddress = (addressData) => {
        let updatedAddrs;
        if (editingAddress) {
          updatedAddrs = userProfile.savedAddresses.map(a => 
            a.id === editingAddress.id ? { ...addressData, id: a.id } : a
          );
          onToast("Address updated successfully!");
        } else {
          const newAddr = {
            ...addressData,
            id: `addr_${Date.now()}`,
            isDefault: userProfile.savedAddresses.length === 0
          };
          updatedAddrs = [...userProfile.savedAddresses, newAddr];
          onToast("New pickup address added!");
        }
        onUpdateProfile({ ...userProfile, savedAddresses: updatedAddrs });
        setShowAddAddressModal(false);
        setEditingAddress(null);
      };

      return (
        <div className="space-y-8 max-w-4xl mx-auto">
          {/* Header */}
          <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <div>
              <div className="flex items-center space-x-2">
                <span className="px-3 py-1 rounded-full bg-emerald-100 text-emerald-800 text-xs font-bold tracking-wider uppercase">
                  User Account
                </span>
                <span className="text-xs text-slate-400">Authenticated Profile</span>
              </div>
              <h2 className="text-2xl sm:text-3xl font-extrabold text-slate-900 mt-1">Profile &amp; Settings</h2>
              <p className="text-xs sm:text-sm text-slate-500">Manage authenticated mobile number, addresses, and recycling credentials</p>
            </div>

            <div className="flex items-center space-x-3">
              <button
                type="button"
                onClick={onSchedulePickup}
                className="px-4 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs shadow-md shadow-emerald-600/20 transition active:scale-95 flex items-center"
              >
                <Icons.Plus className="w-3.5 h-3.5 mr-1.5" />
                Book Pickup
              </button>
            </div>
          </div>

          {/* Profile Overview Card */}
          <div className="bg-white rounded-3xl border border-slate-200 p-6 sm:p-8 shadow-sm">
            <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-6 pb-6 border-b border-slate-100">
              <div className="flex items-center space-x-4">
                <div className="w-16 h-16 rounded-2xl bg-gradient-to-br from-emerald-500 to-teal-700 text-white font-extrabold text-2xl flex items-center justify-center shadow-lg shadow-emerald-600/20">
                  {userProfile.name.charAt(0)}
                </div>
                <div>
                  <div className="flex items-center space-x-2">
                    <h3 className="text-xl font-extrabold text-slate-900">{userProfile.name}</h3>
                    <span className="inline-flex items-center px-2 py-0.5 rounded-full text-xs font-bold bg-emerald-100 text-emerald-800 border border-emerald-300">
                      <Icons.ShieldCheck className="w-3.5 h-3.5 mr-1 text-emerald-600" />
                      Verified
                    </span>
                  </div>
                  <p className="text-xs text-slate-500 mt-0.5">
                    {userProfile.email} • Member since {userProfile.memberSince}
                  </p>
                </div>
              </div>

              <div className="flex items-center space-x-3">
                <button
                  type="button"
                  onClick={() => setIsEditingInfo(!isEditingInfo)}
                  className="px-3.5 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold transition flex items-center"
                >
                  <Icons.Edit className="w-3.5 h-3.5 mr-1.5 text-slate-600" />
                  {isEditingInfo ? "Cancel Editing" : "Edit Profile"}
                </button>
              </div>
            </div>

            {/* Inline Profile Info Edit Form */}
            {isEditingInfo ? (
              <form onSubmit={handleSaveProfileInfo} className="mt-6 p-4 bg-slate-50 rounded-2xl border border-slate-200 space-y-4">
                <h4 className="text-xs font-bold text-slate-700 uppercase tracking-wider">Update Personal Details</h4>
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                  <div>
                    <label className="block text-xs font-semibold text-slate-600 mb-1">Full Name</label>
                    <input
                      type="text"
                      value={profileForm.name}
                      onChange={(e) => setProfileForm({ ...profileForm, name: e.target.value })}
                      className="w-full px-3 py-2 bg-white border border-slate-200 rounded-xl text-xs focus:ring-2 focus:ring-emerald-500"
                      required
                    />
                  </div>
                  <div>
                    <label className="block text-xs font-semibold text-slate-600 mb-1">Email Address</label>
                    <input
                      type="email"
                      value={profileForm.email}
                      onChange={(e) => setProfileForm({ ...profileForm, email: e.target.value })}
                      className="w-full px-3 py-2 bg-white border border-slate-200 rounded-xl text-xs focus:ring-2 focus:ring-emerald-500"
                      required
                    />
                  </div>
                </div>
                <div className="flex justify-end space-x-2 pt-2">
                  <button
                    type="button"
                    onClick={() => setIsEditingInfo(false)}
                    className="px-3.5 py-1.5 text-xs text-slate-600 font-semibold hover:bg-slate-200 rounded-lg"
                  >
                    Cancel
                  </button>
                  <button
                    type="submit"
                    className="px-4 py-1.5 bg-emerald-600 text-white text-xs font-bold rounded-lg hover:bg-emerald-700 transition"
                  >
                    Save Changes
                  </button>
                </div>
              </form>
            ) : null}

            {/* Mobile Authentication Status Card */}
            <div className="mt-6 p-4 rounded-2xl bg-emerald-50/70 border border-emerald-200 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
              <div className="flex items-center space-x-3">
                <div className="w-10 h-10 rounded-xl bg-emerald-600 text-white flex items-center justify-center">
                  <Icons.Phone className="w-5 h-5" />
                </div>
                <div>
                  <div className="flex items-center space-x-2">
                    <span className="font-extrabold text-slate-900 text-sm font-mono">+91 {userProfile.phone}</span>
                    <span className="px-2 py-0.5 rounded-full text-[10px] font-bold bg-emerald-200 text-emerald-900">
                      ✓ Authenticated
                    </span>
                  </div>
                  <p className="text-xs text-slate-600">Mobile number is verified with SMS OTP authentication</p>
                </div>
              </div>

    // ==========================================
    // ADDRESS MODAL COMPONENT
    // ==========================================
    function AddressModal({ initialData, onSave, onClose }) {
      const [form, setForm] = useState({
        label: initialData?.label || "Home",
        flat: initialData?.flat || "",
        street: initialData?.street || "",
        landmark: initialData?.landmark || "",
        city: initialData?.city || "",
        state: initialData?.state || "California",
        pincode: initialData?.pincode || "",
        isGpsVerified: initialData?.isGpsVerified || false
      });
      const [errors, setErrors] = useState({});

      const validate = () => {
        const errs = {};
        if (!form.flat.trim()) errs.flat = "House / Flat number is required";
        if (!form.street.trim()) errs.street = "Street address is required";
        if (!form.city.trim()) errs.city = "City is required";
        if (!form.pincode.trim() || !/^\d{5,6}$/.test(form.pincode.trim())) {
          errs.pincode = "Enter valid 5 or 6 digit PIN code";
        }
        setErrors(errs);
        return Object.keys(errs).length === 0;
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!validate()) return;
        onSave(form);
      };

      const states = ["California", "New York", "Texas", "Illinois", "Florida", "Washington", "Massachusetts", "Georgia", "Other"];

      return (
        <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
          <div className="bg-white rounded-3xl max-w-md w-full p-6 sm:p-8 shadow-2xl border border-slate-200 relative">
            <button
              type="button"
              onClick={onClose}
              className="absolute top-6 right-6 text-slate-400 hover:text-slate-700 p-1 rounded-xl"
            >
              <Icons.X className="w-5 h-5" />
            </button>

            <h3 className="text-xl font-extrabold text-slate-900 mb-1">
              {initialData ? "Edit Address" : "Add New Address"}
            </h3>
            <p className="text-xs text-slate-500 mb-4">Validate address for swift doorstep collections</p>

            <form onSubmit={handleSubmit} className="space-y-4">
              {/* Label */}
              <div>
                <label className="block text-xs font-bold text-slate-700 mb-1">Address Label</label>
                <div className="flex space-x-2">
                  {["Home", "Office", "Other"].map(lbl => (
                    <button
                      key={lbl}
                      type="button"
                      onClick={() => setForm({ ...form, label: lbl })}
                      className={`flex-1 py-1.5 rounded-xl text-xs font-bold border transition ${
                        form.label === lbl
                          ? "bg-emerald-600 text-white border-emerald-600 shadow-sm"
                          : "bg-slate-50 text-slate-600 border-slate-200"
                      }`}
                    >
                      {lbl}
                    </button>
                  ))}
                </div>
              </div>

              {/* Flat */}
              <div>
                <label className="block text-xs font-bold text-slate-700 mb-1">House / Flat / Floor *</label>
                <input
                  type="text"
                  value={form.flat}
                  onChange={(e) => setForm({ ...form, flat: e.target.value })}
                  placeholder="e.g. Flat 301, Building B"
                  className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:ring-2 focus:ring-emerald-500"
                />
                {errors.flat && <p className="text-rose-500 text-[11px] mt-1">{errors.flat}</p>}
              </div>

              {/* Street */}
              <div>
                <label className="block text-xs font-bold text-slate-700 mb-1">Street / Colony *</label>
                <input
                  type="text"
                  value={form.street}
                  onChange={(e) => setForm({ ...form, street: e.target.value })}
                  placeholder="e.g. 100 Sunset Blvd"
                  className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:ring-2 focus:ring-emerald-500"
                />
                {errors.street && <p className="text-rose-500 text-[11px] mt-1">{errors.street}</p>}
              </div>

              {/* Landmark */}
              <div>
                <label className="block text-xs font-bold text-slate-700 mb-1">Landmark (Optional)</label>
                <input
                  type="text"
                  value={form.landmark}
                  onChange={(e) => setForm({ ...form, landmark: e.target.value })}
                  placeholder="e.g. Near Metro gate 2"
                  className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:ring-2 focus:ring-emerald-500"
                />
              </div>

              {/* City & PIN */}
              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className="block text-xs font-bold text-slate-700 mb-1">City *</label>
                  <input
                    type="text"
                    value={form.city}
                    onChange={(e) => setForm({ ...form, city: e.target.value })}
                    placeholder="e.g. Springfield"
                    className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:ring-2 focus:ring-emerald-500"
                  />
                  {errors.city && <p className="text-rose-500 text-[11px] mt-1">{errors.city}</p>}
                </div>
                <div>
                  <label className="block text-xs font-bold text-slate-700 mb-1">PIN / Postal Code *</label>
                  <input
                    type="text"
                    maxLength="6"
                    value={form.pincode}
                    onChange={(e) => setForm({ ...form, pincode: e.target.value.replace(/\D/g, "") })}
                    placeholder="97477"
                    className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs font-mono font-bold focus:ring-2 focus:ring-emerald-500"
                  />
                  {errors.pincode && <p className="text-rose-500 text-[11px] mt-1">{errors.pincode}</p>}
                </div>
              </div>

              {/* State */}
              <div>
                <label className="block text-xs font-bold text-slate-700 mb-1">State</label>
                <select
                  value={form.state}
                  onChange={(e) => setForm({ ...form, state: e.target.value })}
                  className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs cursor-pointer"
                >
                  {states.map(s => <option key={s} value={s}>{s}</option>)}
                </select>
              </div>

              <div className="pt-3 flex justify-end space-x-2 border-t border-slate-100">
                <button
                  type="button"
                  onClick={onClose}
                  className="px-4 py-2 text-xs font-semibold text-slate-600 hover:bg-slate-100 rounded-xl"
                >
                  Cancel
                </button>
                <button
                  type="submit"
                  className="px-5 py-2 bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold rounded-xl shadow-md transition"
                >
                  Save Address
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    // ==========================================
    // OTP VERIFICATION MODAL
    // ==========================================
    function OtpVerificationModal({ phone, expectedOtp, onVerify, onResend, onClose }) {
      const [otpInput, setOtpInput] = useState("");
      const [error, setError] = useState("");
      const [timer, setTimer] = useState(25);

      useEffect(() => {
        if (timer > 0) {
          const id = setTimeout(() => setTimer(timer - 1), 1000);
          return () => clearTimeout(id);
        }
      }, [timer]);

      const handleSubmit = (e) => {
        e.preventDefault();
        if (otpInput.trim() === expectedOtp) {
          onVerify(phone);
        } else {
          setError("Incorrect OTP code. Please check the code provided below or resend.");
        }
      };

      return (
        <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
          <div className="bg-white rounded-3xl max-w-sm w-full p-6 sm:p-8 shadow-2xl border border-slate-200 relative text-center">
            <button
              type="button"
              onClick={onClose}
              className="absolute top-6 right-6 text-slate-400 hover:text-slate-700 p-1 rounded-xl"
            >
              <Icons.X className="w-5 h-5" />
            </button>

            <div className="w-14 h-14 rounded-2xl bg-emerald-100 text-emerald-700 flex items-center justify-center mx-auto mb-4 shadow-sm">
              <Icons.Key className="w-7 h-7" />
            </div>

            <h3 className="text-xl font-extrabold text-slate-900">Verify Mobile Number</h3>
            <p className="text-xs text-slate-500 mt-1">
              We sent a 4-digit verification code to <span className="font-bold text-slate-800">+91 {phone}</span>
            </p>

            {/* Demo Helper Banner with 1-Click Fill */}
            <div className="my-4 p-3 bg-emerald-50 rounded-2xl border border-emerald-200 text-xs text-emerald-900">
              <span className="font-semibold block mb-1">🔑 Demo Verification Code:</span>
              <span className="font-mono text-lg font-extrabold tracking-widest bg-white px-3 py-1 rounded-lg border border-emerald-300 inline-block shadow-sm">
                {expectedOtp}
              </span>
              <div className="mt-2">
                <button
                  type="button"
                  onClick={() => { setOtpInput(expectedOtp); setError(""); }}
                  className="text-emerald-700 hover:text-emerald-800 underline font-bold"
                >
                  Click here to auto-fill code
                </button>
              </div>
            </div>

            <form onSubmit={handleSubmit} className="space-y-4">
              <div>
                <input
                  type="text"
                  maxLength="4"
                  value={otpInput}
                  onChange={(e) => { setOtpInput(e.target.value.replace(/\D/g, "")); setError(""); }}
                  placeholder="• • • •"
                  className="w-36 mx-auto text-center font-mono text-2xl font-bold tracking-widest px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-500"
                  autoFocus
                />
                {error && <p className="text-rose-500 text-[11px] mt-1.5">{error}</p>}
              </div>

              <button
                type="submit"
                className="w-full py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs shadow-md shadow-emerald-600/20 transition active:scale-95 cursor-pointer"
              >
                Confirm &amp; Verify Mobile
              </button>

              <div className="text-[11px] text-slate-400">
                {timer > 0 ? (
                  <span>Resend code in {timer}s</span>
                ) : (
                  <button
                    type="button"
                    onClick={() => { onResend(); setTimer(25); }}
                    className="text-emerald-700 font-bold hover:underline"
                  >
                    Resend OTP Code
                  </button>
                )}
              </div>
            </form>
          </div>
        </div>
      );
    }
