                  ? "bg-emerald-600 text-white border-emerald-600 shadow-lg"
                  : "bg-white text-slate-800 border-emerald-200 hover:border-emerald-400 shadow-sm"
              }`}
            >
              <div className="flex items-center justify-between mb-2">
                <span className={`text-xs font-extrabold uppercase tracking-wider ${statusFilter === "Completed" ? "text-emerald-100" : "text-emerald-700"}`}>
                  Completed
                </span>
                <Icons.CheckCircle className={`w-5 h-5 ${statusFilter === "Completed" ? "text-white" : "text-emerald-600"}`} />
              </div>
              <h3 className={`text-3xl font-extrabold ${statusFilter === "Completed" ? "text-white" : "text-emerald-600"}`}>{completedCount}</h3>
              <span className={`text-[11px] mt-1 inline-block ${statusFilter === "Completed" ? "text-emerald-100" : "text-emerald-600/80"}`}>
                Successfully collected
              </span>
            </button>
          </div>

          {/* Table Container */}
          <div className="bg-white rounded-3xl border border-slate-200 shadow-sm overflow-hidden">
            {/* Filter and Search Bar */}
            <div className="p-4 sm:p-5 border-b border-slate-100 flex flex-col sm:flex-row items-center justify-between gap-3 bg-slate-50/50">
              {/* Filter tabs */}
              <div className="flex items-center space-x-1.5 overflow-x-auto w-full sm:w-auto">
                {["All", "Pending", "Scheduled", "Completed", "Cancelled"].map((status) => (
                  <button
                    key={status}
                    type="button"
                    onClick={() => setStatusFilter(status)}
                    className={`px-3.5 py-1.5 rounded-xl text-xs font-bold transition ${
                      statusFilter === status
                        ? "bg-emerald-600 text-white shadow-sm"
                        : "bg-white text-slate-600 border border-slate-200 hover:bg-slate-100"
                    }`}
                  >
                    {status}
                    {status === "All" ? ` (${requests.length})` : ` (${requests.filter(r => r.status === status).length})`}
                  </button>
                ))}
              </div>

              {/* Search input with clear button */}
              <div className="w-full sm:w-72 relative">
                <input
                  type="text"
                  placeholder="Search ID, customer, phone, city..."
                  value={searchQuery}
                  onChange={(e) => setSearchQuery(e.target.value)}
                  className="w-full pl-3 pr-8 py-2 text-xs bg-white border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-500 shadow-sm"
                />
                {searchQuery && (
                  <button
                    type="button"
                    onClick={() => setSearchQuery("")}
                    className="absolute inset-y-0 right-0 pr-2.5 flex items-center text-slate-400 hover:text-slate-600"
                    title="Clear search"
                  >
                    <Icons.X className="w-3.5 h-3.5" />
                  </button>
                )}
              </div>
            </div>

            {/* Table */}
            <div className="overflow-x-auto custom-scrollbar">
              <table className="w-full text-left border-collapse text-xs">
                <thead>
                  <tr className="bg-slate-50 border-b border-slate-200 text-slate-600 font-extrabold uppercase tracking-wider">
                    <th className="py-3.5 px-4">Request ID</th>
                    <th className="py-3.5 px-4">Requester</th>
                    <th className="py-3.5 px-4">Waste Type</th>
                    <th className="py-3.5 px-4">Pickup Date</th>
                    <th className="py-3.5 px-4">Address</th>
                    <th className="py-3.5 px-4">Current Status</th>
                    <th className="py-3.5 px-4 text-center">Change Status</th>
                    <th className="py-3.5 px-4 text-right">Actions</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-slate-100">
                  {filteredRequests.length === 0 ? (
                    <tr>
                      <td colSpan="8" className="py-12 text-center text-slate-400">
                        <div className="w-12 h-12 mx-auto rounded-2xl bg-slate-100 text-slate-400 flex items-center justify-center mb-3">
                          <Icons.Recycle className="w-6 h-6" />
                        </div>
                        <p className="font-semibold text-slate-600">No pickup requests match your criteria.</p>
                      </td>
                    </tr>
                  ) : (
                    filteredRequests.map((req) => {
                      const badge = getCategoryBadge(req.category);
                      return (
                        <tr key={req.id} className="hover:bg-slate-50/80 transition">
                          {/* Request ID */}
                          <td className="py-3.5 px-4 font-mono font-bold text-slate-800">
                            <button
                              type="button"
                              onClick={() => onViewDetails(req)}
                              className="text-emerald-700 hover:text-emerald-900 hover:underline font-bold"
                              title="Click to view details"
                            >
                              {req.id}
                            </button>
                          </td>

                          {/* Requester */}
                          <td className="py-3.5 px-4">
                            <div className="font-bold text-slate-900">{req.name}</div>
                            <div className="text-[11px] text-slate-500 font-mono">+91 {req.phone}</div>
                          </td>

                          {/* Waste Type */}
                          <td className="py-3.5 px-4">
                            <span className={`inline-flex items-center px-2 py-0.5 rounded-md font-bold text-[11px] border ${badge.bg}`}>
                              {badge.icon}
                              {req.category}
                            </span>
                          </td>

                          {/* Pickup Date */}
                          <td className="py-3.5 px-4 text-slate-700 font-semibold whitespace-nowrap">
                            {req.date}
                          </td>

                          {/* Address */}
                          <td className="py-3.5 px-4 max-w-xs truncate text-slate-600" title={req.address}>
                            {req.address}
                          </td>

                          {/* Current Status */}
                          <td className="py-3.5 px-4 whitespace-nowrap">
                            <StatusBadge status={req.status} />
                          </td>

                          {/* Change Status Dropdown */}
                          <td className="py-3.5 px-4 text-center">
                            <select
                              value={req.status}
                              onChange={(e) => onStatusChange(req.id, e.target.value)}
                              className="px-2.5 py-1.5 rounded-xl border border-slate-300 text-xs font-bold bg-white text-slate-800 focus:outline-none focus:ring-2 focus:ring-emerald-500 shadow-sm cursor-pointer hover:border-emerald-500 transition"
                            >
                              <option value="Pending">Pending</option>
                              <option value="Scheduled">Scheduled</option>
                              <option value="Completed">Completed</option>
                              <option value="Cancelled">Cancelled</option>
                            </select>
                          </td>

                          {/* Row Action Buttons */}
                          <td className="py-3.5 px-4 text-right whitespace-nowrap">
                            <div className="flex items-center justify-end space-x-1.5">
                              <button
                                type="button"
                                onClick={() => onViewDetails(req)}
                                className="p-1.5 rounded-lg text-slate-500 hover:text-emerald-700 hover:bg-emerald-50 transition"
                                title="View Details"
                              >
                                <Icons.Eye className="w-4 h-4" />
                              </button>

                              {req.status === "Pending" && (
                                <button
                                  type="button"
                                  onClick={() => onStatusChange(req.id, "Scheduled")}
                                  className="px-2 py-1 rounded-lg bg-sky-50 text-sky-700 hover:bg-sky-100 font-bold text-[11px] border border-sky-200 transition"
                                >
                                  Schedule
                                </button>
                              )}

                              {req.status === "Scheduled" && (
                                <button
                                  type="button"
                                  onClick={() => onStatusChange(req.id, "Completed")}
                                  className="px-2 py-1 rounded-lg bg-emerald-50 text-emerald-700 hover:bg-emerald-100 font-bold text-[11px] border border-emerald-200 transition"
                                >
                                  Complete
                                </button>
                              )}

                              <button
                                type="button"
                                onClick={() => onDeleteRequest(req.id)}
                                className="p-1.5 rounded-lg text-slate-400 hover:text-rose-600 hover:bg-rose-50 transition"
                                title="Delete request"
                              >
                                <Icons.Trash className="w-4 h-4" />
                              </button>
                            </div>
                          </td>
                        </tr>
                      );
                    })
                  )}
                </tbody>
              </table>
            </div>

            {/* Table Footer */}
            <div className="p-4 bg-slate-50 border-t border-slate-100 flex flex-col sm:flex-row items-center justify-between text-xs text-slate-500 gap-2">
              <span>Showing {filteredRequests.length} of {requests.length} total entries</span>
              <span className="text-emerald-700 font-semibold flex items-center">
                <span className="w-2 h-2 rounded-full bg-emerald-500 mr-2"></span>
                Changes persist automatically in browser localStorage
              </span>
            </div>
          </div>
        </div>
      );
    }

    // ==========================================
    // DETAIL & TRACKING MODAL COMPONENT
    // ==========================================
    function DetailModal({ request, isAdmin, onClose, onCancelRequest, onStatusChange, onDeleteRequest }) {
      if (!request) return null;
      const badge = getCategoryBadge(request.category);

      const steps = [
        { label: "Request Placed", desc: "Authenticated via OTP in system", done: true },
        { label: "Admin Approved", desc: "Collection route mapped & scheduled", done: request.status === "Scheduled" || request.status === "Completed" },
        { label: "Vehicle Dispatched", desc: "Crew on transit to doorstep", done: request.status === "Scheduled" || request.status === "Completed" },
        { label: "Recycled & Completed", desc: "Materials safely routed to plant", done: request.status === "Completed" }
      ];

      return (
        <div className="fixed inset-0 z-50 overflow-y-auto bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
          <div className="bg-white rounded-3xl max-w-lg w-full p-6 sm:p-8 shadow-2xl border border-slate-200 relative printable-modal">
            <button
              type="button"
              onClick={onClose}
              className="absolute top-6 right-6 text-slate-400 hover:text-slate-700 p-1 rounded-xl hover:bg-slate-100 transition no-print focus:outline-none"
              title="Close modal"
            >
              <Icons.X className="w-5 h-5" />
            </button>

            {/* Modal Header */}
            <div className="mb-6 pb-4 border-b border-slate-100">
              <div className="flex items-center space-x-2 mb-1">
                <span className="text-xs font-mono font-bold px-2 py-0.5 rounded bg-slate-100 text-slate-800">
                  {request.id}
                </span>
                <StatusBadge status={request.status} />
              </div>
              <h3 className="text-xl font-extrabold text-slate-900">Waste Pickup Details</h3>
              <p className="text-xs text-slate-500">Scheduled doorstep collection &amp; segregation tracking</p>
            </div>

            {/* Stepper */}
            {request.status !== "Cancelled" ? (
              <div className="mb-6 bg-slate-50 p-4 rounded-2xl border border-slate-100">
                <h4 className="text-xs font-bold text-slate-700 uppercase tracking-wider mb-3">Live Pickup Progress</h4>
                <div className="space-y-3">
                  {steps.map((st, i) => (
                    <div key={i} className="flex items-start space-x-3 text-xs">
                      <div className={`w-5 h-5 rounded-full flex items-center justify-center font-bold text-[10px] shrink-0 mt-0.5 ${
                        st.done ? "bg-emerald-600 text-white" : "bg-slate-200 text-slate-500"
                      }`}>
                        {st.done ? "✓" : i + 1}
                      </div>
                      <div>
                        <p className={`font-bold ${st.done ? "text-slate-900" : "text-slate-400"}`}>{st.label}</p>
                        <p className="text-[11px] text-slate-500">{st.desc}</p>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            ) : (
              <div className="mb-6 bg-rose-50 p-4 rounded-2xl border border-rose-200 text-xs text-rose-800 flex items-center space-x-3">
                <Icons.XCircle className="w-6 h-6 text-rose-600 shrink-0" />
                <div>
                  <p className="font-bold">This pickup request was Cancelled</p>
                  <p className="text-[11px] text-rose-600">You can reschedule or submit a new pickup request anytime.</p>
                </div>
              </div>
            )}

            {/* Details */}
            <div className="space-y-3 text-xs bg-slate-50/70 p-4 rounded-2xl border border-slate-100 mb-6">
              <div className="flex items-center justify-between">
                <span className="text-slate-500">Waste Category:</span>
                <span className={`inline-flex items-center px-2 py-0.5 rounded font-bold border ${badge.bg}`}>
                  {badge.icon}
                  {request.category}
                </span>
              </div>
              <div className="flex items-center justify-between">
                <span className="text-slate-500">Requester Name:</span>
                <span className="font-bold text-slate-800">{request.name}</span>
              </div>
              <div className="flex items-center justify-between">
                <span className="text-slate-500">Authenticated Mobile:</span>
                <span className="font-bold text-emerald-700 flex items-center font-mono">
                  +91 {request.phone}
                  <span className="ml-1.5 text-[10px] bg-emerald-100 text-emerald-800 px-1 rounded">✓ Verified</span>
                </span>
              </div>
              <div className="flex items-center justify-between">
                <span className="text-slate-500">Pickup Date:</span>
                <span className="font-bold text-slate-900">{request.date}</span>
              </div>
              <div className="pt-2 border-t border-slate-200/60">
                <span className="text-slate-500 block mb-1">Doorstep Address:</span>
                <p className="font-medium text-slate-800">{request.address}</p>
              </div>
              {request.notes && (
                <div className="pt-2 border-t border-slate-200/60">
                  <span className="text-slate-500 block mb-0.5">Instructions:</span>
                  <p className="font-medium text-slate-700 italic">"{request.notes}"</p>
                </div>
              )}
            </div>

            {/* Modal Bottom Buttons */}
            <div className="flex flex-wrap items-center justify-between gap-3 pt-3 border-t border-slate-100 no-print">
              <div className="flex items-center space-x-2">
                <button
                  type="button"
                  onClick={() => window.print()}
                  className="inline-flex items-center px-3.5 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold transition"
                  title="Print collection receipt or pass"
                >
                  <Icons.Printer className="w-3.5 h-3.5 mr-1.5 text-slate-600" />
                  Print Slip
                </button>

                {request.status !== "Cancelled" && request.status !== "Completed" && (
                  <button
                    type="button"
                    onClick={() => onCancelRequest(request.id)}
                    className="inline-flex items-center px-3 py-2 rounded-xl bg-rose-50 hover:bg-rose-100 text-rose-700 text-xs font-bold border border-rose-200 transition"
                  >
                    Cancel Request
                  </button>
                )}
              </div>

              <div className="flex items-center space-x-2">
                {isAdmin && (
                  <button
                    type="button"
                    onClick={() => onDeleteRequest(request.id)}
                    className="p-2 text-rose-600 hover:bg-rose-50 rounded-xl transition"
                    title="Delete record"
                  >
                    <Icons.Trash className="w-4 h-4" />
                  </button>
                )}

                <button
                  type="button"
                  onClick={onClose}
                  className="px-5 py-2 rounded-xl bg-slate-900 text-white text-xs font-bold hover:bg-slate-800 transition"
                >
                  Close
                </button>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // ==========================================
    // HELP & INFO MODAL COMPONENT
    // ==========================================
    function InfoModal({ onClose }) {
      return (
        <div className="fixed inset-0 z-50 overflow-y-auto bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
          <div className="bg-white rounded-3xl max-w-lg w-full p-6 sm:p-8 shadow-2xl border border-slate-200 relative">
            <button
              type="button"
              onClick={onClose}
              className="absolute top-6 right-6 text-slate-400 hover:text-slate-700 p-1 rounded-xl hover:bg-slate-100 transition focus:outline-none"
            >
              <Icons.X className="w-5 h-5" />
            </button>

            <div className="mb-6 pb-4 border-b border-slate-100">
              <div className="inline-flex items-center px-2.5 py-0.5 rounded-full bg-emerald-100 text-emerald-800 text-xs font-bold mb-1">
                EcoCollect FAQ &amp; Guidelines
              </div>
              <h3 className="text-xl font-extrabold text-slate-900">How It Works</h3>
              <p className="text-xs text-slate-500">Everything you need to know about doorstep waste collection</p>
            </div>

            <div className="space-y-4 text-xs text-slate-600 max-h-96 overflow-y-auto custom-scrollbar pr-1">
              <div className="p-3 bg-slate-50 rounded-2xl border border-slate-100">
                <h5 className="font-bold text-slate-900 mb-1">How does mobile authentication work?</h5>
                <p>When booking or saving your profile, enter your 10-digit mobile number and click "Verify OTP". A 4-digit code will be sent to confirm your identity.</p>
              </div>

              <div className="p-3 bg-slate-50 rounded-2xl border border-slate-100">
                <h5 className="font-bold text-slate-900 mb-1">How is the doorstep address validated?</h5>
                <p>Address inputs require house/flat number, street name, city, and a valid 5-6 digit PIN code. You can also click "Detect GPS" to verify your exact physical coordinates.</p>
              </div>

              <div className="p-3 bg-slate-50 rounded-2xl border border-slate-100">
                <h5 className="font-bold text-slate-900 mb-1">Where are my saved addresses located?</h5>
                <p>Visit the new <strong>Profile</strong> tab in the navigation bar to add, edit, or set default pickup addresses (Home, Office, etc.).</p>
              </div>

              <div className="p-3 bg-slate-50 rounded-2xl border border-slate-100">
                <h5 className="font-bold text-slate-900 mb-1">Does this require any backend server?</h5>
                <p>No backend is required. All authentication states, addresses, and pickup logs are saved directly in browser LocalStorage, making this prototype 100% offline-ready.</p>
              </div>
            </div>

            <div className="mt-6 pt-4 border-t border-slate-100 flex justify-end">
              <button
                type="button"
                onClick={onClose}
                className="px-5 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold shadow-md shadow-emerald-600/20 transition active:scale-95"
              >
                Got It
              </button>
            </div>
          </div>
        </div>
      );
    }

    // Render the React application
    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
